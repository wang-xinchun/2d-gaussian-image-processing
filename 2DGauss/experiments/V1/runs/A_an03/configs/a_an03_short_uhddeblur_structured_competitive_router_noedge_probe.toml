[identity]
architecture = "V1"
template = "T01"
run = "A_an03"
full_id = "V1/T01/A_an03"

[dataset]
name = "UHD_deblur"
task = "paired_uhd_deblurring_edge_guided_directional_frequency_tlc_structured_competitive_router_no_edge_state_probe"
train_input = "/root/autodl-tmp/2D_Gaussian_Dataset/UHD_deblur/train/input_new"
train_target = "/root/autodl-tmp/2D_Gaussian_Dataset/UHD_deblur/train/gt_new"
val_input = "/root/autodl-tmp/2D_Gaussian_Dataset/UHD_deblur/train/input_new"
val_target = "/root/autodl-tmp/2D_Gaussian_Dataset/UHD_deblur/train/gt_new"
test_input = "/root/autodl-tmp/2D_Gaussian_Dataset/UHD_deblur/test/input300"
test_target = "/root/autodl-tmp/2D_Gaussian_Dataset/UHD_deblur/test/gt300"
accepted_inventory_doc = "docs/unpacked_dataset_acceptance_20260425.md"
strategy_doc = "docs/next_experiment_dataset_strategy_20260425.md"
metric_target_doc = "docs/stage_metric_targets_20260505.md"
train_offset = 40
train_limit = 0
val_offset = 0
val_limit = 20
preflight_val_limit = 20
train_crop_size = 512
val_crop_size = 0
augment_flip = true
num_workers = 8

[model]
in_channels = 3
out_channels = 3
width = 48
lowres_scale = 4
highres_blocks = 3
lowres_blocks = 6
decoder_blocks = 3
affine_rank = 6
gaussian_atoms = 6
gaussian_param_dim = 10
max_frequency = 6.0
max_texture_gain = 1.2
use_edge_guidance = true
edge_guidance_blocks = 2
edge_guidance_strength = 0.25
edge_guidance_use_control_gate = true
use_directional_frequency_guidance = true
use_train_inference_consistency = true
train_context_size = 696
train_supervision_crop_size = 512
use_gaussian_decoder_guidance = true
gaussian_decoder_guidance_blocks = 1
gaussian_decoder_guidance_strength = 0.15
gaussian_decoder_guidance_use_decoder_state_gate = false
use_gaussian_shared_prior = true
gaussian_shared_prior_blocks = 1
use_gaussian_control_router = true
gaussian_control_router_blocks = 1
gaussian_control_router_use_decoder_state = true
gaussian_control_router_use_edge_state = false
gaussian_control_router_role_delta_strength = 0.50
gaussian_control_router_use_competitive_role_gate = true
gaussian_control_router_role_gate_temperature = 0.75
use_gaussian_feature_refinement = true
gaussian_feature_refinement_blocks = 1
gaussian_feature_refinement_strength = 0.10
gaussian_feature_refinement_use_confidence_normalization = false
gaussian_feature_refinement_use_intervention_demand = false
gaussian_feature_refinement_use_decoder_detail_gate = false

[loss]
charbonnier_weight = 1.0
gradient_weight = 0.05
laplacian_weight = 0.02
use_edge_weighted_reconstruction = true
edge_weighted_reconstruction_strength = 0.02
edge_weighted_reconstruction_floor = 1.0

[optimizer]
name = "AdamW"
lr = 0.0002
weight_decay = 0.0001

[training]
tier = "short"
wall_clock_minutes = 58
max_steps = 2500
batch_size = 6
grad_accum = 1
seed = 20260532
device = "auto"
amp = false
log_interval = 10
val_interval = 500
checkpoint_interval = 250
max_val_batches = 20
target_reserved_memory_gb_min = 85.0
target_reserved_memory_gb_max = 93.0

[archive]
output_root = "experiments/V1/runs"
snapshot_on_start = true
