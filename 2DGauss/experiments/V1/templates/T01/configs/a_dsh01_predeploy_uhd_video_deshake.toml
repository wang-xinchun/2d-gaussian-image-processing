[identity]
architecture = "V1"
template = "T01"
run = "A_dsh01_predeploy"
full_id = "V1/T01/A_dsh01_predeploy"

[task]
name = "UHD_video_deshaking"
status = "predeploy_waiting_for_dataset"
classification = "current_uhd_video_deshaking_predeploy"
notes = "This package is for ultra-high-definition video deshaking/stabilization preparation."

[dataset]
expected_source = "incoming 390G 4K/8K video deshaking dataset"
data_root = "TO_BE_FILLED_AFTER_TRANSFER"
input_dir = "TO_BE_FILLED_AFTER_TRANSFER"
