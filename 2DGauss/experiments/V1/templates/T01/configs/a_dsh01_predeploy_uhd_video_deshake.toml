supervision_form = "unknown_until_dataset_inspection"
train_split = "pending"
val_split = "pending"
test_split = "pending"

[baseline_frame_enhancer]
classification = "frame_enhancement_baseline_not_full_video_deshaking"
config = "experiments/V1/runs/A_y03/configs/a_y03_medium_uhddeblur_feature_refinement_plus_edge_weighted_lightedge_5h_confirmation.toml"
